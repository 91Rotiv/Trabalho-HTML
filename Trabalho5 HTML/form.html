<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="brasaoEB.jpg" type="img/x-icon">
    <title>Formulário de Cadastro</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background-color: #515604;
            margin: 0;
            padding: 20px;
        }

        form{
            max-width: 500px;
            margin: auto;
            background-color: rgb(121, 119, 119);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #000000;
        }

        fieldset{
            border: none;
            padding: 0;
        }

        legend{
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        label{
            display: block;
            margin-top: 12px;
            margin-bottom: 5px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="date"],
        input[type="file"],
        select,
        textarea{
            width: 100%;
            padding: 8px;
            border: 1px solid #000000;
            border-radius: 6px;
            box-sizing: border-box;
        }

        input:focus,
        select:focus,
        textarea:focus{
            border-color: #1d7d0a;
            outline: none;
        }

        .sexo{
            margin-top: 5px;
        }

        .sexo label{
            display: inline;
            margin-right: 15px;
        }

        button{
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #155f06;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover{
            background-color: #1d800a;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="date"]{
            background-color: #868f094c;
        }

        option{
            background-color: #868f094c;
        }

        select{
            background-color: #868f094c;
        }

        textarea{
            background-color: #868f094c;
        }

        input[type="radio"]{
            accent-color: #155f06;
        }

        input[type="file"]::file-selector-button{
            background-color: #155f06;
            color: white;
            border: 1px solid rgb(255, 255, 255);
            border-radius: 6px;
            padding: 8px 12px;
            cursor: pointer;
        }

        input[type="file"]::file-selector-button:hover{
            background-color: #1c7e08;
        }

    </style>

</head>
<body>

    <form>

        <fieldset>

            <legend>Preencha para efetuar o cadastro</legend>

            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" required>

            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" required>

            <label for="nascimento">Data de nascimento</label>
            <input type="date" id="nascimento" name="nascimento">

            <label for="curso">Concurso a Ser Prestado</label>
            <select id="curso" name="curso">
                <option value="">Selecione</option>
                <option>ESA (Escola de Sargento das Armas)</option>
                <option>EsPCEx (Escola Preparatória de Cadetes do Exército)</option>
                <option>IME (Instituto Militar de Engenharia)</option>
            </select>

            <label>Sexo</label>

            <div class="sexo">
                <input type="radio" id="masculino" name="sexo" value="Masculino">
                <label for="masculino">Masculino</label>

                <input type="radio" id="feminino" name="sexo" value="Feminino">
                <label for="feminino">Feminino</label>
            </div>

            <label for="interesses">Interesses</label>
            <input type="text" id="interesses" name="interesses">

            <label for="comentarios">Comentários</label>
            <textarea id="comentarios" name="comentarios" rows="4"></textarea>

            <label for="foto">Upload de Documentos (CPF, Alistamento Militar Obrigatório e Comprovante de Vacina)</label>
            <input type="file" id="foto" name="foto">

            <button type="submit">Cadastrar</button>

        </fieldset>

    </form>

</body>
</html>
